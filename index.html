<!doctype html>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint to avoid a dark flash.
      try {
        if (localStorage.getItem('redha-theme') === 'light') {
          document.documentElement.classList.add('light-mode')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f7f8')
        }
      } catch (error) {
        // Storage may be unavailable (private mode); fall back to the dark theme.
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
